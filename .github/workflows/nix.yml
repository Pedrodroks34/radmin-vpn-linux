name: Nix Build

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
  workflow_dispatch:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Check repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Build with Nix
      run: nix build

    - name: Test build outputs
      run: |
        test -x result/bin/radmin-vpn
        test -f result/lib/systemd/system/radmin-vpn.service
