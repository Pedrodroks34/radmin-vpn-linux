name: Build

on:
  push:
    branches: [main, rust-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 libgtk-4-dev

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release --workspace

      - name: Upload workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-linux-release
          path: |
            target/release/radmin-vpn
            target/release/librvpn_dnsfix.so
            target/release/librvpn_reuseport.so
            packaging/systemd/radmin-vpn.service
            packaging/tmpfiles.d/radmin-vpn.conf

  release:
    needs: rust
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: radmin-vpn-linux-release

      - name: Create release archive
        run: |
          set -e
          mkdir -p radmin-vpn-linux-${{ github.ref_name }}
          cp radmin-vpn radmin-vpn-linux-${{ github.ref_name }}/
          if [ -f librvpn_dnsfix.so ]; then
            cp librvpn_dnsfix.so radmin-vpn-linux-${{ github.ref_name }}/
          fi
          if [ -f librvpn_reuseport.so ]; then
            cp librvpn_reuseport.so radmin-vpn-linux-${{ github.ref_name }}/
          fi
          cp radmin-vpn.service radmin-vpn-linux-${{ github.ref_name }}/ || true
          cp radmin-vpn.conf radmin-vpn-linux-${{ github.ref_name }}/ || true
          tar czf radmin-vpn-linux-${{ github.ref_name }}.tar.gz radmin-vpn-linux-${{ github.ref_name }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            radmin-vpn-linux-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
