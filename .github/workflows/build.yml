name: Build

on:
  push:
    branches: [main, rust-rewrite]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 libgtk-4-dev

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release --workspace

      - name: Upload workspace binaries
        uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-linux-release
          path: |
            target/release/radmin-vpn
            target/release/librvpn_dnsfix.so
            target/release/librvpn_reuseport.so
            packaging/systemd/radmin-vpn.service
            packaging/tmpfiles.d/radmin-vpn.conf

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make dpkg-dev rpm zstd docker.io \
            gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev

      - name: Build all targets
        run: make

      - name: Resolve version
        id: version
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .deb, .rpm and .tar.gz
        run: ./packaging/build-packages.sh "${{ steps.version.outputs.version }}" dist

      - name: Build Arch package
        run: ./packaging/build-arch-package.sh "${{ steps.version.outputs.version }}" dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-linux-packages
          path: dist/*

  release:
    needs: [rust, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: radmin-vpn-linux-release

      - uses: actions/download-artifact@v4
        with:
          name: radmin-vpn-linux-packages
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
          generate_release_notes: true
