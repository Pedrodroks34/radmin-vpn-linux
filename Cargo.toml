[workspace]
members = [
    ".",
    "crates/rvpn-dnsfix",
    "crates/rvpn-reuseport",
]
resolver = "2"

[package]
name = "radmin-vpn"
description = "Radmin VPN for Linux - Complete Rust rewrite"
version = "1.0.0"
edition = "2021"
authors = ["Radmin VPN Linux Project"]

[features]
default = []
gui = ["gtk4"]
dnsfix = []
reuseport = []

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
rtnetlink = "0.7"
futures = "0.3"
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.28", features = ["fs", "signal", "time", "poll"] }
libc = "0.2"
fxhash = "0.2"
once_cell = "1.19"
uuid = { version = "1", features = ["v4"] }

# Optional GTK4 for filter UI
gtk4 = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = true

[workspace.package]
version = "1.0.0"
edition = "2021"